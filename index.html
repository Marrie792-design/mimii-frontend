<!doctype html>
<html lang="en" data-theme="ocean">
  <head>
    <meta charset="UTF-8" />
    <!-- apply the saved color theme before first paint (avoids a color flash) -->
    <script>
      try {
        var t = localStorage.getItem('pf_theme');
        if (['ocean', 'emerald', 'sunset', 'orchid'].indexOf(t) !== -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mariam Mushtaq — MERN Stack / Full-Stack Developer from Lahore, Pakistan."
    />
    <title>Mariam Mushtaq | MERN Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
